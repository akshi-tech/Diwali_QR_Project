
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shubh Deepawali 🪔</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fireworks background -->
    <canvas id="fireworks"></canvas>

    <!-- Main greeting card -->
    <div class="container">

        <p class="top-text">
            ✦ THE FESTIVAL OF LIGHTS ✦
        </p>

        <h1>Shubh Deepawali</h1>

        <div class="gold-line"></div>

        <p class="message">
            May your life shine with happiness,
            prosperity and endless blessings.
        </p>

        <!-- Animated Diyas -->
        <div class="diyas">

            <div class="diya">
                <div class="flame"></div>
                <div class="bowl"></div>
            </div>

            <div class="diya">
                <div class="flame"></div>
                <div class="bowl"></div>
            </div>

            <div class="diya">
                <div class="flame"></div>
                <div class="bowl"></div>
            </div>

        </div>

        <button onclick="celebrate()">
            Celebrate Diwali ✨
        </button>

        <p class="footer">
            Made with love ❤️
        </p>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
